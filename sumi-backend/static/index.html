<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Annotation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RAG Annotation</h1>
    <form id="search-form">
      <input id="query" type="text" placeholder="Type a query…" autocomplete="off" autofocus>
      <label for="top-k">top_k</label>
      <input id="top-k" type="number" value="10" min="1" max="50">
      <button type="submit" id="run">Run</button>
    </form>
    <div id="status" class="muted"></div>
    <div id="errors" class="banner" hidden></div>
  </header>
  <main id="results"></main>
  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <div class="pills"></div>
        <span class="badge" hidden>annotated</span>
      </div>
      <pre class="chunk-text"></pre>
      <button class="show-more" hidden>show more</button>
      <div class="card-bottom">
        <div class="score-buttons">
          <button data-score="0">Not relevant (0)</button>
          <button data-score="1">Partially (1)</button>
          <button data-score="2">Highly relevant (2)</button>
        </div>
        <span class="save-status"></span>
      </div>
    </article>
  </template>
  <script src="app.js"></script>
</body>
</html>
